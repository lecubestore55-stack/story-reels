services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: reels
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reels}
      POSTGRES_DB: reels
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "start", "--", "-p", "3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://reels:${POSTGRES_PASSWORD:-reels}@db:5432/reels
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3000:3000"   # put Apache/Nginx/Cloudflare in front for HTTPS
    depends_on: [db]

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATABASE_URL: postgres://reels:${POSTGRES_PASSWORD:-reels}@db:5432/reels
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on: [db]

volumes:
  pgdata:
